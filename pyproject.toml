[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezodeer-multi-training"
version = "0.1.0"
description = "Detection and semantic segmentation training and evaluation for EzoDeer-Multi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9", "pycocotools>=2.0.7", "opencv-python>=4.8", "PyYAML>=6", "matplotlib>=3.6"]

[project.optional-dependencies]
detection = ["ultralytics==8.4.60"]
segmentation = ["torch>=2.6", "torchvision>=0.21", "segmentation-models-pytorch==0.5.0", "timm==1.0.22", "huggingface-hub==0.36.0", "safetensors==0.6.2"]
all = ["torch>=2.6", "torchvision>=0.21", "ultralytics==8.4.60", "segmentation-models-pytorch==0.5.0", "timm==1.0.22", "huggingface-hub==0.36.0", "safetensors==0.6.2"]

[tool.setuptools.packages.find]
include = ["ezodeer_training*"]
